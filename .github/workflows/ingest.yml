name: MCP & Skills Ingest

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest

    # 关键：所有命令都在 "SMM back" 目录下执行
    defaults:
      run:
        working-directory: "SMM back"

    env:
      DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
      DOUBAO_ENDPOINT_ID: ${{ secrets.DOUBAO_ENDPOINT_ID }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run ingest (fetch MCP & Skills into Pinecone)
        run: |
          python ingest.py
